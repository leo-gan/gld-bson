# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
context:
  version: "0.1.0"

package:
  name: mojo-bson
  version: ${{ version }}

source:
  path: ..

build:
  number: 0
  script:
    - mkdir -p ${{ PREFIX }}/lib/mojo ${{ PREFIX }}/bin
    - mojo precompile -I src src/wire -o ${{ PREFIX }}/lib/mojo/wire.mojoc
    - mojo precompile -I src src/runtime -o ${{ PREFIX }}/lib/mojo/runtime.mojoc
    - mojo precompile -I src src/schema -o ${{ PREFIX }}/lib/mojo/schema.mojoc
    - mojo precompile -I src src/bson -o ${{ PREFIX }}/lib/mojo/bson.mojoc
    - mojo build -I src src/codegen/cli.mojo -o ${{ PREFIX }}/bin/gld-bsongen-mojo

requirements:
  build:
    - mojo-compiler ==1.1.0
  host:
    - mojo-compiler ==1.1.0
  run:
    - mojo-compiler ==1.1.0

tests:
  - script:
      - if: unix
        then:
          - mojo run test_import.mojo
          - gld-bsongen-mojo --help
    files:
      recipe:
        - test_import.mojo

about:
  homepage: https://leo-gan.github.io/gld-bson/
  repository: https://github.com/leo-gan/gld-bson
  documentation: https://leo-gan.github.io/gld-bson/
  license: MIT
  license_file: LICENSE
  summary: From-scratch BSON library for Mojo
  description: |
    Runtime and code generator written in Mojo. Does not wrap libbson
    or any other C, C++, or Rust BSON library. The package installs
    bson.mojoc (plus wire/runtime/schema) and the gld-bsongen-mojo CLI.
